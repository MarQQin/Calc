<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA / theme -->
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calc">

  <title>Calc</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- Display -->
    <div class="display">
      <button class="display__history-btn" id="historyToggle" aria-label="Toggle history">
        <span id="historyArrow">&#9662;</span> History
      </button>
      <div class="display__expr"   id="exprDisplay"   aria-live="polite" aria-label="Expression"></div>
      <div class="display__result" id="resultDisplay" aria-live="polite" aria-label="Result"></div>
    </div>

    <!-- History panel -->
    <div class="history-panel" id="historyPanel" aria-label="Calculation history">
      <ul class="history-list" id="historyList"></ul>
    </div>

    <!-- Keypad -->
    <div class="keypad-wrapper">
      <div class="keypad keypad--top"    id="keypadTop"    role="group" aria-label="Scientific keys"></div>
      <div class="keypad keypad--bottom" id="keypadBottom" role="group" aria-label="Main keys"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
