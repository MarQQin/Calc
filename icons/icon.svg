<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App tile background -->
  <rect width="512" height="512" rx="88" fill="#1a1a1a"/>
  <!-- Calculator body -->
  <rect x="88" y="72" width="336" height="368" rx="28" fill="#111111"/>
  <!-- Display screen -->
  <rect x="112" y="96" width="288" height="100" rx="12" fill="#0d0d0d"/>
  <!-- Display: result line (orange accent) -->
  <rect x="240" y="148" width="136" height="10" rx="5" fill="#e67e22" opacity="0.9"/>
  <!-- Display: expression line (dim) -->
  <rect x="280" y="172" width="96" height="7" rx="3.5" fill="#555555"/>
  <!-- Button grid: row 1 (control) -->
  <rect x="112" y="220" width="60" height="48" rx="8" fill="#3a3a3c"/>
  <rect x="184" y="220" width="60" height="48" rx="8" fill="#3a3a3c"/>
  <rect x="256" y="220" width="60" height="48" rx="8" fill="#3a3a3c"/>
  <rect x="328" y="220" width="72" height="48" rx="8" fill="#e67e22"/>
  <!-- Button grid: row 2 -->
  <rect x="112" y="280" width="60" height="48" rx="8" fill="#1e1e1e"/>
  <rect x="184" y="280" width="60" height="48" rx="8" fill="#1e1e1e"/>
  <rect x="256" y="280" width="60" height="48" rx="8" fill="#1e1e1e"/>
  <rect x="328" y="280" width="72" height="48" rx="8" fill="#e67e22"/>
  <!-- Button grid: row 3 -->
  <rect x="112" y="340" width="60" height="48" rx="8" fill="#1e1e1e"/>
  <rect x="184" y="340" width="60" height="48" rx="8" fill="#1e1e1e"/>
  <rect x="256" y="340" width="60" height="48" rx="8" fill="#1e1e1e"/>
  <rect x="328" y="340" width="72" height="48" rx="8" fill="#e67e22"/>
</svg>
